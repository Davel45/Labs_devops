apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
  namespace: aogiri
  labels:
    app: aogiri-user
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aogiri-user
  template:
    metadata:
      labels:
        app: aogiri-user
    spec:
      containers:
        - name: user-service
          image: aogiri-user:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: user-config
            - secretRef:
                name: user-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
