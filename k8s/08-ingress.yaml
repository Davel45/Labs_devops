apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aogiri-ingress
  namespace: aogiri
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8081
