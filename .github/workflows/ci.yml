name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  pull-requests: write
  statuses: write

jobs:
  # =========================================================================
  # Job 1: Build, Static Analysis (Checkstyle), and Tests for each microservice
  # =========================================================================
  build-and-test:
    name: Build, Lint & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Failure in one service does not cancel other parallel jobs
      matrix:
        service:
          - aogiri-user
          - aogiri-tournament
          - aogiri-match
          - aogiri-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Static Code Analysis (Checkstyle)
        run: |
          echo "Running Checkstyle static analysis for ${{ matrix.service }}..."
          ./mvnw checkstyle:check -pl ${{ matrix.service }}

      - name: Build Service (Compile & Package)
        run: |
          echo "Compiling and packaging ${{ matrix.service }}..."
          ./mvnw clean package -pl ${{ matrix.service }} -am -DskipTests

      - name: Run Tests (Unit & Integration)
        run: |
          echo "Running tests for ${{ matrix.service }}..."
          ./mvnw test -pl ${{ matrix.service }}

  # =========================================================================
  # Job 2: Build Docker images, scan for vulnerabilities with Trivy, and push to ghcr.io
  # =========================================================================
  docker-build-and-push:
    name: Docker Build, Scan & Push (${{ matrix.service }})
    needs: [build-and-test] # Depends on successful build, lint, and test of all services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - aogiri-user
          - aogiri-tournament
          - aogiri-match
          - aogiri-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize Repository Owner to lowercase
        run: |
          echo "OWNER_LOWERCASE=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LOWERCASE }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' }} # Load locally for PR to allow Trivy scan

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        if: github.event_name == 'pull_request'
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
